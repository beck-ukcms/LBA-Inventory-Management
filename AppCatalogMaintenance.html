<section id="catalog-maintenance-screen" class="screen">
 <div class="section-title"><div><h2>Catalog Maintenance</h2><p class="muted">Edit active and inactive PT and Paper products.</p></div><button class="btn secondary" type="button" onclick="showScreen('admin-screen')">Back</button></div>
 <div class="panel"><div class="actions"><button id="cat-pt-tab" class="btn" type="button" onclick="showCatalogType('pt')">Pulltabs</button><button id="cat-paper-tab" class="btn secondary" type="button" onclick="showCatalogType('paper')">Paper</button></div><div id="catalog-status" class="status"></div></div>
 <div id="cat-pt-panel" class="panel"><label>Game / Form</label><input id="cat-pt-search" list="cat-pt-list" autocomplete="off" onchange="loadCatalogPT()"><datalist id="cat-pt-list"></datalist><div id="cat-pt-fields" class="form-grid"></div><button id="save-catalog-pt" class="btn" type="button" onclick="saveCatalogPT()">Save PT Game</button></div>
 <div id="cat-paper-panel" class="panel hidden"><label>Paper Type</label><input id="cat-paper-search" list="cat-paper-list" autocomplete="off" onchange="loadCatalogPaper()"><datalist id="cat-paper-list"></datalist><div id="cat-paper-fields" class="form-grid"></div><button id="save-catalog-paper" class="btn" type="button" onclick="saveCatalogPaper()">Save Paper Type</button></div>
</section>
<script>
  let CATALOG_DATA = {pt: [], paper: [], gameTypes: []};
  let CAT_PT = null;
  let CAT_PAPER = null;
  async function refreshCatalogMaintenanceData() {
    CATALOG_DATA = await server('getCatalogMaintenanceData', ADMIN_TOKEN);
    $('cat-pt-list').innerHTML = CATALOG_DATA.pt.map((x) => `<option value="${escapeHtml(x.label)}"></option>`).join('');
    $('cat-paper-list').innerHTML = CATALOG_DATA.paper.map((x) => `<option value="${escapeHtml(x.label)}"></option>`).join('');
  }
  async function openCatalogMaintenance() {
    showScreen('catalog-maintenance-screen');
    clearStatus('catalog-status');
    try { await refreshCatalogMaintenanceData(); showCatalogType('pt'); }
    catch (error) { setStatus('catalog-status', error.message, true); }
  }
  function showCatalogType(type) {
    $('cat-pt-panel').classList.toggle('hidden', type !== 'pt');
    $('cat-paper-panel').classList.toggle('hidden', type !== 'paper');
    $('cat-pt-tab').className = type === 'pt' ? 'btn' : 'btn secondary';
    $('cat-paper-tab').className = type === 'paper' ? 'btn' : 'btn secondary';
  }
  function field(id, label, value, type = 'text') { return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value)}"></div>`; }
  function selectField(id, label, value, values) { return `<div><label for="${id}">${label}</label><select id="${id}">${values.map((x) => `<option value="${escapeHtml(x)}"${x === value ? ' selected' : ''}>${escapeHtml(x)}</option>`).join('')}</select></div>`; }
  function loadCatalogPT() {
    CAT_PT = CATALOG_DATA.pt.find((x) => x.label === $('cat-pt-search').value) || null;
    if (!CAT_PT) return;
    $('cat-pt-fields').innerHTML = field('cpt-name','Game Name',CAT_PT.gameName) + selectField('cpt-type','Game Type',CAT_PT.gameType,CATALOG_DATA.gameTypes) + field('cpt-form','Primary Form',CAT_PT.primaryFormNumber) + field('cpt-alt','Alternate Forms',CAT_PT.alternateFormNumbers) + field('cpt-order','Display Order',CAT_PT.displayOrder,'number') + field('cpt-cards','Cards per Deal',CAT_PT.cardsPerDeal,'number') + field('cpt-case','Deals per Case',CAT_PT.dealsPerCase,'number') + field('cpt-price','Price per Card',CAT_PT.pricePerCard,'number') + field('cpt-payout','Payout per Deal',CAT_PT.payoutPerDeal,'number') + field('cpt-cost','Manufacturer Cost per Deal',CAT_PT.manufacturerCostPerDeal,'number') + field('cpt-target','Target On Hand',CAT_PT.targetOnHand,'number') + field('cpt-bundled','Target Bundled',CAT_PT.targetBundled,'number') + field('cpt-notes','Notes',CAT_PT.notes) + `<div><label><input id="cpt-active" type="checkbox" ${CAT_PT.active ? 'checked' : ''}> Active</label></div>`;
  }
  async function saveCatalogPT() {
    if (!CAT_PT) return;
    await withBusyButton('save-catalog-pt', async () => {
      const value = (id) => $(id).value;
      try {
        const updated = await server('updatePTGame', ADMIN_TOKEN, {gameId:CAT_PT.gameId,gameName:value('cpt-name'),gameType:value('cpt-type'),primaryFormNumber:value('cpt-form'),alternateFormNumbers:value('cpt-alt'),displayOrder:value('cpt-order'),cardsPerDeal:value('cpt-cards'),dealsPerCase:value('cpt-case'),pricePerCard:value('cpt-price'),payoutPerDeal:value('cpt-payout'),manufacturerCostPerDeal:value('cpt-cost'),targetOnHand:value('cpt-target'),targetBundled:value('cpt-bundled'),notes:value('cpt-notes'),active:$('cpt-active').checked});
        await refreshCatalogMaintenanceData(); $('cat-pt-search').value = updated.label; loadCatalogPT(); setStatus('catalog-status','PT game saved.');
      } catch (error) { setStatus('catalog-status', error.message, true); }
    });
  }
  function loadCatalogPaper() {
    CAT_PAPER = CATALOG_DATA.paper.find((x) => x.label === $('cat-paper-search').value) || null;
    if (!CAT_PAPER) return;
    $('cat-paper-fields').innerHTML = field('cp-short','Short Name',CAT_PAPER.shortName) + field('cp-desc','Description',CAT_PAPER.description) + field('cp-order','Display Order',CAT_PAPER.displayOrder,'number') + field('cp-packbox','Packs per Box',CAT_PAPER.packsPerBox,'number') + field('cp-boxcase','Boxes per Case',CAT_PAPER.boxesPerCase,'number') + field('cp-cost','Manufacturer Cost per Case',CAT_PAPER.manufacturerCostPerCase,'number') + field('cp-price','Sales Price per Pack',CAT_PAPER.salesPricePerPack,'number') + field('cp-target','Target On Hand',CAT_PAPER.targetOnHand,'number') + field('cp-notes','Notes',CAT_PAPER.notes) + `<div><label><input id="cp-active" type="checkbox" ${CAT_PAPER.active ? 'checked' : ''}> Active</label></div>`;
  }
  async function saveCatalogPaper() {
    if (!CAT_PAPER) return;
    await withBusyButton('save-catalog-paper', async () => {
      const value = (id) => $(id).value;
      try {
        const updated = await server('updatePaperType', ADMIN_TOKEN, {paperId:CAT_PAPER.paperId,shortName:value('cp-short'),description:value('cp-desc'),displayOrder:value('cp-order'),packsPerBox:value('cp-packbox'),boxesPerCase:value('cp-boxcase'),manufacturerCostPerCase:value('cp-cost'),salesPricePerPack:value('cp-price'),targetOnHand:value('cp-target'),notes:value('cp-notes'),active:$('cp-active').checked});
        await refreshCatalogMaintenanceData(); $('cat-paper-search').value = updated.label; loadCatalogPaper(); setStatus('catalog-status','Paper type saved.');
      } catch (error) { setStatus('catalog-status', error.message, true); }
    });
  }
</script>
