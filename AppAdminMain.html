<section class="screen" id="admin-screen">
 <div class="section-title">
  <div>
   <h2>
    Administration
   </h2>
   <p class="muted">
    Inventory controls and system maintenance.
   </p>
  </div>
  <button class="btn secondary" onclick="logoutAdmin()">
   Exit Admin
  </button>
 </div>
 <div class="grid">
  <button class="tile" onclick="openPTReconciliation()">
   <div class="tile-copy">
    <h2>
     PT Reconciliation
    </h2>
    <p>
     Establish or correct deal-level pull-tab inventory.
    </p>
   </div>
  </button>
  <button class="tile" disabled="">
   <div class="tile-copy">
    <h2>
     Paper Reconciliation
    </h2>
    <p>
     Coming soon.
    </p>
   </div>
  </button>
  <button class="tile" onclick="openOrdering()">
   <div class="tile-copy">
    <h2>
     Order Stock
    </h2>
    <p>
     Add unidentified PT deals or paper cases.
    </p>
   </div>
  </button>
  <button class="tile" disabled="">
   <div class="tile-copy">
    <h2>
     Inventory Issues
    </h2>
    <p>
     Coming soon.
    </p>
   </div>
  </button>
 </div>
 <div class="panel" style="margin-top:18px">
  <h3>
   System
  </h3>
  <div class="actions">
   <button class="btn secondary" onclick="validateSchemaUI()">
    Validate Schema
   </button>
   <button class="btn secondary" onclick="showScreen('home-screen')">
    Main Menu
   </button>
  </div>
  <div class="status" id="admin-status">
  </div>
 </div>
</section>
<script>
 async function validateSchemaUI(){clearStatus('admin-status');try{const r=await server('runSchemaValidationFromAdmin',ADMIN_TOKEN);setStatus('admin-status',r.valid?`Schema v${r.version} is valid. ${r.warnings.length} warning(s).`:`Validation failed: ${r.errors.join(' | ')}`,!r.valid)}catch(e){setStatus('admin-status',e.message,true)}}
async function logoutAdmin(){try{await server('endAdminSession',ADMIN_TOKEN)}catch(e){}ADMIN_TOKEN='';showScreen('home-screen')}
</script>
