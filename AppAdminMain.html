<section
  id="admin-screen"
  class="screen"
>
  <div class="section-title">
    <div>
      <h2>Administration</h2>
      <p class="muted">Inventory controls and system maintenance.</p>
    </div>

    <button
      class="btn secondary"
      type="button"
      onclick="logoutAdmin()"
    >
      Exit Admin
    </button>
  </div>

  <div class="grid">
    <button class="tile" type="button" onclick="openOrdering()"><div class="tile-copy"><h2>Order Stock</h2><p>Add unidentified PT deals or paper cases.</p></div></button>
    <button class="tile" type="button" onclick="openReconciliation()"><div class="tile-copy"><h2>Reconciliation</h2><p>Reconcile PT and Paper physical inventory.</p></div></button>
    <button class="tile" type="button" onclick="openCatalogMaintenance()"><div class="tile-copy"><h2>Catalog Maintenance</h2><p>Maintain PT and Paper product catalogs.</p></div></button>
    <button class="tile" type="button" disabled><div class="tile-copy"><h2>Inventory Issues</h2><p>Coming soon.</p></div></button>
  </div>
  <div
    class="panel"
    style="margin-top: 18px;"
  >
    <h3>System</h3>

    <div class="actions">
      <button
        class="btn secondary"
        type="button"
        onclick="validateSchemaUI()"
      >
        Validate Schema
      </button>

      <button
        class="btn secondary"
        type="button"
        onclick="showScreen('home-screen')"
      >
        Main Menu
      </button>
    </div>

    <div
      id="admin-status"
      class="status"
    ></div>
  </div>
</section>

<script>
  async function validateSchemaUI() {
    clearStatus('admin-status');

    try {
      const result = await server(
        'runSchemaValidationFromAdmin',
        ADMIN_TOKEN
      );

      setStatus(
        'admin-status',
        result.valid
          ? `Schema v${result.version} is valid. ${result.warnings.length} warning(s).`
          : `Validation failed: ${result.errors.join(' | ')}`,
        !result.valid
      );
    } catch (error) {
      setStatus(
        'admin-status',
        error.message,
        true
      );
    }
  }


  async function logoutAdmin() {
    try {
      await server(
        'endAdminSession',
        ADMIN_TOKEN
      );
    } catch (error) {
      console.log(
        'Admin logout cleanup failed:',
        error
      );
    }

    ADMIN_TOKEN = '';
    showScreen('home-screen');
  }
</script>
