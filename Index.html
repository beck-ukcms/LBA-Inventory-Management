<!DOCTYPE html>
<html>
 <head>
  <base target="_top"/>
  <?!= include_('AppCommon'); ?>
 </head>
 <body>
  <header>
   <h1>
    <?= appConfig.appName ?>
   </h1>
   <p>
    Central access to LBA Bingo operational tools and inventory administration.
   </p>
  </header>
  <main>
   <section class="screen active" id="home-screen">
    <div class="grid">
     <? appConfig.links.forEach(function(link){ ?>
     <? if (link.id === 'pt') { ?>
     <button class="tile" type="button" onclick="openPTBundling()">
      <img alt="" src="<?= link.icon ?>"/>
      <div class="tile-copy">
       <h2>
        <?= link.title ?>
       </h2>
       <p>
        <?= link.subtitle ?>
       </p>
      </div>
     </button>
     <? } else if (link.id === 'paperwork') { ?>
     <button class="tile" type="button" onclick="openPaperworkLogin()">
      <img alt="" src="<?= link.icon ?>"/>
      <div class="tile-copy">
       <h2>
        <?= link.title ?>
       </h2>
       <p>
        <?= link.subtitle ?>
       </p>
      </div>
     </button>
     <? } else { ?>
     <a class="tile" href="<?= link.url ?>" rel="noopener noreferrer" target="_blank">
      <img alt="" src="<?= link.icon ?>"/>
      <div class="tile-copy">
       <h2>
        <?= link.title ?>
       </h2>
       <p>
        <?= link.subtitle ?>
       </p>
      </div>
     </a>
     <? } ?>
     <? }); ?>
     <button class="tile" type="button" onclick="openDashboard()">
      <div class="tile-visual dashboard">▦</div>
      <div class="tile-copy"><h2>Inventory Dashboard</h2><p>Review active inventory and place the weekly order.</p></div>
     </button>
     <button class="tile" type="button" onclick="openAdminLogin()">
      <div class="tile-visual admin">
       ⚙
      </div>
      <div class="tile-copy">
       <h2>
        Admin Mode
       </h2>
       <p>
        Inventory reconciliation and administration.
       </p>
      </div>
     </button>
    </div>
    <p class="muted home-support">
     Support:
     <?= appConfig.supportEmail ?>
    </p>
   </section>
   <?!= include_('AppPTBundling'); ?>
   <?!= include_('AppDashboard'); ?>
   <?!= include_('AppPaperworkManagement'); ?>
   <?!= include_('AppAdminMain'); ?>
   <?!= include_('AppReconciliation'); ?>
   <?!= include_('AppCatalogMaintenance'); ?>
   <?!= include_('AppInventoryIssues'); ?>
   <?!= include_('AppPTReconciliation'); ?>
   <?!= include_('AppPaperReconciliation'); ?>
   <?!= include_('AppOrdering'); ?>
  </main>

  <div class="modal" id="paperwork-login-modal">
   <div class="modal-card">
    <button class="close" type="button" onclick="cancelPaperworkLogin()">×</button>
    <h2>Paperwork Management</h2>
    <label for="paperwork-admin-code">Administrative code</label>
    <input autocomplete="one-time-code" id="paperwork-admin-code" inputmode="numeric" type="password"/>
    <div class="actions" style="margin-top:16px">
     <button class="btn" type="button" onclick="submitPaperworkLogin()">Continue</button>
     <button class="btn secondary" type="button" onclick="cancelPaperworkLogin()">Cancel</button>
    </div>
   </div>
  </div>
  <div class="modal" id="admin-login-modal">
   <div class="modal-card">
    <button class="close" type="button" onclick="closeModal('admin-login-modal')">
     ×
    </button>
    <h2>
     Admin Mode
    </h2>
    <label for="admin-code">
     Administrative code
    </label>
    <input autocomplete="one-time-code" id="admin-code" inputmode="numeric" type="password"/>
    <div class="actions" style="margin-top:16px">
     <button class="btn" type="button" onclick="submitAdminLogin()">
      Continue
     </button>
     <button class="btn secondary" type="button" onclick="closeModal('admin-login-modal')">
      Cancel
     </button>
    </div>
    <div class="status" id="login-status">
    </div>
   </div>
  </div>
  <script>
   function openAdminLogin(){clearStatus('login-status');$('admin-code').value='';openModal('admin-login-modal');setTimeout(()=>$('admin-code').focus(),50)}
async function submitAdminLogin(){clearStatus('login-status');try{const r=await server('authenticateAdmin',$('admin-code').value);if(!r.ok){setStatus('login-status',r.message,true);return}ADMIN_TOKEN=r.token;closeModal('admin-login-modal');showScreen('admin-screen')}catch(e){setStatus('login-status',e.message,true)}}
$('admin-code').addEventListener('keydown',e=>{if(e.key==='Enter')submitAdminLogin()});
  $('paperwork-admin-code').addEventListener('keydown',e=>{if(e.key==='Enter')submitPaperworkLogin()});
  </script>
 </body>
</html>
