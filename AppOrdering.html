<section
  id="ordering-screen"
  class="screen"
>
  <div class="section-title">
    <div>
      <h2>Order Stock</h2>

      <p class="muted">
        Orders immediately add unidentified stock to inventory.
        Serial numbers are assigned later during processing.
      </p>
    </div>

    <button
      class="btn secondary"
      type="button"
      onclick="showScreen('admin-screen')"
    >
      Back
    </button>
  </div>


  <div class="panel">
    <div class="actions">
      <button
        id="pt-order-tab"
        class="btn"
        type="button"
        onclick="showOrderType('pt')"
      >
        Pulltabs
      </button>

      <button
        id="paper-order-tab"
        class="btn secondary"
        type="button"
        onclick="showOrderType('paper')"
      >
        Paper
      </button>
    </div>

    <div
      id="order-status"
      class="status"
    ></div>
  </div>


  <!-- ============================================================
       PT ORDERING
       ============================================================ -->

  <div
    id="pt-order-panel"
    class="panel"
  >
    <h3>Record PT Order</h3>

    <div class="form-grid">

      <div>
        <label for="order-pt-form">
          Game / Form
        </label>

        <input
          id="order-pt-form"
          list="order-pt-form-list"
          autocomplete="off"
          onchange="showSelectedPTCaseSize()"
        >
        <datalist id="order-pt-form-list"></datalist>
      </div>


      <div>
        <label for="order-pt-date">
          Order Date
        </label>

        <input
          id="order-pt-date"
          type="date"
        >
      </div>


      <div>
        <label for="order-pt-cases">
          Cases Ordered
        </label>

        <input
          id="order-pt-cases"
          type="number"
          min="0"
          step="1"
          value="0"
        >
      </div>


      <div>
        <label for="order-pt-loose">
          Loose Deals
        </label>

        <input
          id="order-pt-loose"
          type="number"
          min="0"
          step="1"
          value="0"
        >
      </div>


      <div>
        <label>
          Deals per Case
        </label>

        <div
          id="order-pt-case-size-display"
          class="pill"
        >
          Select a game
        </div>
      </div>


      <div class="wide">
        <label for="order-pt-notes">
          Notes
        </label>

        <textarea id="order-pt-notes"></textarea>
      </div>

    </div>


    <div class="actions">
      <button
        class="btn"
        type="button"
        onclick="submitPTOrder()"
      >
        Add PT Stock
      </button>

      <button
        class="btn secondary"
        type="button"
        onclick="openModal('new-game-modal')"
      >
        Add New PT Game
      </button>
    </div>
  </div>


  <!-- ============================================================
       PAPER ORDERING
       ============================================================ -->

  <div
    id="paper-order-panel"
    class="panel hidden"
  >
    <h3>Record Paper Order</h3>

    <div class="form-grid">

      <div>
        <label for="order-paper-type">
          Paper Type
        </label>

        <select
          id="order-paper-type"
          onchange="showSelectedPaperCaseSize()"
        ></select>
      </div>


      <div>
        <label for="order-paper-date">
          Order Date
        </label>

        <input
          id="order-paper-date"
          type="date"
        >
      </div>


      <div>
        <label for="order-paper-cases">
          Cases Ordered
        </label>

        <input
          id="order-paper-cases"
          type="number"
          min="1"
          step="1"
          value="1"
        >
      </div>


      <div>
        <label>
          Packs per Case
        </label>

        <div
          id="order-paper-case-size-display"
          class="pill"
        >
          Select a paper type
        </div>
      </div>


      <div class="wide">
        <label for="order-paper-notes">
          Notes
        </label>

        <textarea id="order-paper-notes"></textarea>
      </div>

    </div>


    <div class="actions">
      <button
        class="btn"
        type="button"
        onclick="submitPaperOrder()"
      >
        Add Paper Stock
      </button>

      <button
        class="btn secondary"
        type="button"
        onclick="openModal('new-paper-modal')"
      >
        Add New Paper Type
      </button>
    </div>
  </div>
</section>


<!-- ================================================================
     ADD NEW PAPER TYPE
     ================================================================ -->

<div
  id="new-paper-modal"
  class="modal"
>
  <div class="modal-card">

    <button
      class="close"
      type="button"
      onclick="closeModal('new-paper-modal')"
    >
      ×
    </button>


    <h2>Add New Paper Type</h2>


    <div class="form-grid">

      <div>
        <label for="new-paper-short-name">
          Short Name
        </label>

        <input
          id="new-paper-short-name"
          autocomplete="off"
        >
      </div>


      <div>
        <label for="new-paper-description">
          Description
        </label>

        <input
          id="new-paper-description"
          autocomplete="off"
        >
      </div>


      <div>
        <label for="new-paper-display-order">
          Display Order
        </label>

        <input
          id="new-paper-display-order"
          type="number"
          min="0"
          step="1"
          value="0"
        >
      </div>


      <div>
        <label for="new-paper-packs-per-box">
          Packs per Box
        </label>

        <input
          id="new-paper-packs-per-box"
          type="number"
          min="0"
          step="0.5"
        >
      </div>


      <div>
        <label for="new-paper-boxes-per-case">
          Boxes per Case
        </label>

        <input
          id="new-paper-boxes-per-case"
          type="number"
          min="1"
          step="1"
        >
      </div>


      <div>
        <label for="new-paper-cost-per-case">
          Manufacturer Cost per Case
        </label>

        <input
          id="new-paper-cost-per-case"
          type="number"
          min="0"
          step="0.01"
        >
      </div>


      <div>
        <label for="new-paper-sales-price">
          Sales Price per Pack
        </label>

        <input
          id="new-paper-sales-price"
          type="number"
          min="0"
          step="0.01"
        >
      </div>


      <div>
        <label for="new-paper-target">
          Target On Hand
        </label>

        <input
          id="new-paper-target"
          type="number"
          min="0"
          step="1"
          value="0"
        >
      </div>


      <div class="wide">
        <label for="new-paper-notes">
          Notes
        </label>

        <textarea id="new-paper-notes"></textarea>
      </div>

    </div>


    <div
      id="new-paper-status"
      class="status"
    ></div>


    <!--
      Temporary diagnostic area.

      This remains visible after Create Paper Type so that we can inspect
      exactly what createPaperType() returned before getOrderingCatalogs()
      filters the Paper Catalog.
    -->
    <div
      id="new-paper-debug"
      style="
        display: none;
        margin: 12px 0;
        padding: 10px;
        border: 1px solid #b9c5d5;
        border-radius: 9px;
        background: #f7f9fc;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: monospace;
        font-size: 12px;
      "
    ></div>


    <div class="actions">

      <button
        id="create-paper-type-button"
        class="btn"
        type="button"
        onclick="saveNewPaperType()"
      >
        Create Paper Type
      </button>

      <button
        class="btn secondary"
        type="button"
        onclick="closeModal('new-paper-modal')"
      >
        Cancel
      </button>

    </div>

  </div>
</div>


<script>

  let ORDER_CATALOGS = {
    pt: [],
    paper: [],
    gameTypes: []
  };


  /* ================================================================
     ORDERING INITIALIZATION
     ================================================================ */

  async function openOrdering() {

    showScreen('ordering-screen');

    $('order-pt-date').value = localIsoDate();
    $('order-paper-date').value = localIsoDate();

    clearStatus('order-status');


    try {

      ORDER_CATALOGS =
        await server(
          'getOrderingCatalogs',
          ADMIN_TOKEN
        );


      renderOrderingCatalogs();

      showOrderType('pt');

    } catch (error) {

      setStatus(
        'order-status',
        error.message,
        true
      );
    }
  }


  function renderOrderingCatalogs() {

    /*
     * Populate the shared Add New PT Game modal.
     *
     * This works regardless of whether Ordering or PT Reconciliation
     * happens to be the first admin module opened.
     */
    populatePTGameTypeDropdown(
      ORDER_CATALOGS.gameTypes
    );


    $('order-pt-form-list').innerHTML = ORDER_CATALOGS.pt
      .map((option) => {
        return `<option value="${escapeHtml(option.label)}"></option>`;
      })
      .join('');


    $('order-paper-type').innerHTML =
      '<option value="">Select paper type...</option>' +

      ORDER_CATALOGS.paper
.map((option) => {

          return (
`<option value="${escapeHtml(option.paperId)}">` +
            `${escapeHtml(option.label)}` +
            '</option>'
          );
        })
        .join('');
  }


  function showOrderType(type) {

    $('pt-order-panel').classList.toggle(
      'hidden',
      type !== 'pt'
    );


    $('paper-order-panel').classList.toggle(
      'hidden',
      type !== 'paper'
    );


    $('pt-order-tab').className =
      type === 'pt'
        ? 'btn'
        : 'btn secondary';


    $('paper-order-tab').className =
      type === 'paper'
        ? 'btn'
        : 'btn secondary';
  }


  /* ================================================================
     PT ORDERING
     ================================================================ */

  function showSelectedPTCaseSize() {

      const selectedLabel =
        $('order-pt-form').value.trim();


    if (!selectedLabel) {

      $('order-pt-case-size-display').textContent =
        'Select a game';

      return;
    }


    const selected = ORDER_CATALOGS.pt.find((option) => {
return option.label === selectedLabel;
    });
    if (!selected) {
      $('order-pt-case-size-display').textContent = 'Select a valid game';
      return;
    }


    $('order-pt-case-size-display').textContent =
      `${selected.dealsPerCase} deals / case`;
  }


  async function submitPTOrder() {

    clearStatus('order-status');


      const selectedLabel =
        $('order-pt-form').value.trim();


    if (!selectedLabel) {

      setStatus(
        'order-status',
        'Select a PT game/form.',
        true
      );

      return;
    }


    const selected = ORDER_CATALOGS.pt.find((option) => {
return option.label === selectedLabel;
    });
    if (!selected) {
      setStatus(
        'order-status',
        'Select a valid PT game/form.',
        true
      );
      return;
    }


    try {

      const result =
        await server(
          'recordPTOrder',
          ADMIN_TOKEN,
          {
            gameId:
              selected.gameId,

            formNumber:
              selected.formNumber,

            effectiveDate:
              $('order-pt-date').value,

            cases:
              $('order-pt-cases').value,

            looseDeals:
              $('order-pt-loose').value,

            notes:
              $('order-pt-notes').value
          }
        );


      setStatus(
        'order-status',

        `${result.quantity} unidentified PT deal(s) added. ` +
        `${result.dealsPerCase} deals per case.`
      );

    } catch (error) {

      setStatus(
        'order-status',
        error.message,
        true
      );
    }
  }


  /* ================================================================
     PAPER ORDERING
     ================================================================ */

  function showSelectedPaperCaseSize() {

      const selectedPaperId =
        $('order-paper-type').value;
      if (!selectedPaperId) {

      $('order-paper-case-size-display').textContent =
        'Select a paper type';

      return;
    }


      const selected = ORDER_CATALOGS.paper.find((option) => {
        return option.paperId === selectedPaperId;
      });
      if (!selected) {
        $('order-paper-case-size-display').textContent =
          'Select a valid paper type';
        return;
      }


    $('order-paper-case-size-display').textContent =
      `${selected.packsPerCase} packs / case`;
  }


  async function submitPaperOrder() {

    clearStatus('order-status');


      const selectedPaperId =
        $('order-paper-type').value;
      if (!selectedPaperId) {

      setStatus(
        'order-status',
        'Select a paper type.',
        true
      );

      return;
    }


      const selected = ORDER_CATALOGS.paper.find((option) => {
        return option.paperId === selectedPaperId;
      });
      if (!selected) {
        setStatus(
          'order-status',
          'Select a valid paper type.',
          true
        );
        return;
      }


    try {

      const result =
        await server(
          'recordPaperOrder',
          ADMIN_TOKEN,
          {
            paperId:
              selected.paperId,

            effectiveDate:
              $('order-paper-date').value,

            cases:
              $('order-paper-cases').value,

            notes:
              $('order-paper-notes').value
          }
        );


      setStatus(
        'order-status',

        `${result.cases} unidentified paper case(s), ` +
        `${result.packs} packs, added to inventory.`
      );

    } catch (error) {

      setStatus(
        'order-status',
        error.message,
        true
      );
    }
  }


    /* ================================================================
       ADD NEW PAPER TYPE
       ================================================================ */
    async function saveNewPaperType() {
      const button = $('create-paper-type-button');
      await withBusyButton(button, async () => {
        clearStatus('new-paper-status');
        try {
          const result = await server('createPaperType', ADMIN_TOKEN, {
            shortName: $('new-paper-short-name').value,
            description: $('new-paper-description').value,
            displayOrder: $('new-paper-display-order').value,
            packsPerBox: $('new-paper-packs-per-box').value,
            boxesPerCase: $('new-paper-boxes-per-case').value,
            manufacturerCostPerCase: $('new-paper-cost-per-case').value,
            salesPricePerPack: $('new-paper-sales-price').value,
            targetOnHand: $('new-paper-target').value,
            notes: $('new-paper-notes').value
          });
          ORDER_CATALOGS = await server('getOrderingCatalogs', ADMIN_TOKEN);
          renderOrderingCatalogs();
$('order-paper-type').value = result.paperId;
          showSelectedPaperCaseSize();
          closeModal('new-paper-modal');
          setStatus('order-status', `${result.shortName} was created and selected.`);
        } catch (error) {
          setStatus('new-paper-status', error.message, true);
        }
      });
    }
</script>
