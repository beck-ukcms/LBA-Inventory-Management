<!--
  AppCommon.html
  Shared web application styles and browser utilities.
  Scope: Defines the common visual system, screen/modal behavior, server RPC wrapper, validation helpers, and option rendering.
  Current as of v1.20.
-->
<style>
  :root {
    --navy: #08275a;
    --blue: #075db6;
    --red: #e2212b;
    --gold: #ffc928;
    --ink: #142033;
    --muted: #637083;
    --background: #f3f6fb;
    --card: #ffffff;
    --line: #d8e0eb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--background);
    color: var(--ink);
    font: 16px/1.45 Arial, sans-serif;
  }

  header {
    padding: 22px 24px;
    color: #ffffff;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    box-shadow: 0 3px 12px #001b3d40;
  }

  header h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 34px);
  }

  header p {
    margin: 4px 0 0;
    opacity: 0.88;
  }

  main {
    max-width: 1160px;
    margin: auto;
    padding: 24px;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
  }

  .tile,
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 6px 18px #173e6a12;
  }

  .tile {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform 0.16s, box-shadow 0.16s;
  }

  .tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px #173e6a25;
  }

  .tile img,
  .tile-visual {
    width: 100%;
    aspect-ratio: 1;
  }
  .tile img {
    object-fit: cover;
  }
  .tile-visual {
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: #ffffff;
    font-size: clamp(72px, 10vw, 132px);
    line-height: 1;
  }
  .tile-visual.admin {
    background: linear-gradient(135deg, #4c5f78, var(--navy));
  }

  .tile-copy,
  .panel {
    padding: 15px;
  }

  .tile h2 {
    margin: 0 0 5px;
    font-size: 19px;
  }

  .tile p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .panel {
    margin-bottom: 18px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn {
    appearance: none;
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--blue);
    color: #ffffff;
    font-weight: 700;
    cursor: pointer;
  }

  .btn:hover {
    filter: brightness(0.94);
  }

  .btn.secondary {
    background: #e8eef7;
    color: var(--navy);
  }

  .btn.danger {
    background: var(--red);
  }

  .btn.gold {
    background: var(--gold);
    color: #302300;
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  label {
    display: block;
    margin: 12px 0 5px;
    font-weight: 700;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid #b9c5d5;
    border-radius: 9px;
    background: #ffffff;
    font: inherit;
  }

  textarea {
    min-height: 82px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 0 14px;
  }

  .wide {
    grid-column: 1 / -1;
  }

  .table-scroll {
    overflow-x: auto;
  }

  table {
    width: 100%;
    margin-top: 12px;
    border-collapse: collapse;
  }

  th,
  td {
    padding: 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
  }

  th {
    background: #edf3fa;
  }

  .new-record-row {
    background: #fff8dc;
  }

  .deal-id {
    font-family: monospace;
    white-space: nowrap;
  }

  .status {
    display: none;
    margin: 12px 0;
    padding: 10px 12px;
    border-radius: 9px;
  }

  .status.show {
    display: block;
  }

  .status.ok {
    background: #e6f5e9;
    color: #155b25;
  }

  .status.err {
    background: #fee9ea;
    color: #8f1820;
  }
  .status.warn {
    background: #fff2cc;
    color: #7f6000;
  }

  .muted {
    color: var(--muted);
    font-size: 14px;
  }

  .pill {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 999px;
    background: #e8eef7;
    font-size: 13px;
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #001a3d99;
  }

  .modal.show {
    display: flex;
  }

  .modal-card {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow: auto;
    padding: 22px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 20px 60px #0006;
  }

  .modal-card h2 {
    margin-top: 0;
  }

  .close {
    float: right;
    border: 0;
    background: none;
    font-size: 27px;
    cursor: pointer;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 600px) {
    main {
      padding: 15px;
    }

    header {
      padding: 18px;
    }

    .panel {
      padding: 15px;
    }
  }
</style>

<script>
  let ADMIN_TOKEN = '';

  const $ = (id) => document.getElementById(id);


  function server(functionName, ...argumentsList) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => {
          reject(new Error(error.message || error));
        })[functionName](...argumentsList);
    });
  }


  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach((screen) => {
      screen.classList.remove('active');
    });

    $(screenId).classList.add('active');
    window.scrollTo(0, 0);
  }


  function setStatus(
    elementId,
    message,
    isError = false
  ) {
    const element = $(elementId);

    element.textContent = message;
    element.className = `status show ${isError ? 'err' : 'ok'}`;
  }


  function clearStatus(elementId) {
    const element = $(elementId);

    element.className = 'status';
    element.textContent = '';
  }


  function openModal(modalId) {
    $(modalId).classList.add('show');
  }


  function closeModal(modalId) {
    $(modalId).classList.remove('show');
  }

  async function withBusyButton(buttonOrId, action) {
      const button = typeof buttonOrId === 'string'
        ? $(buttonOrId)
        : buttonOrId;
      if (typeof action !== 'function') {
        throw new Error('A busy-button action is required.');
      }
      if (!button) {
        return action();
      }
      const wasDisabled = button.disabled;
      button.disabled = true;
      try {
        return await action();
      } finally {
        button.disabled = wasDisabled;
      }
  }

function localIsoDate(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    (character) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]
  );
}


  /**
   * Populates a select element using a shared, consistent implementation.
   */
  function populateSelectOptions(
    selectOrId,
    values,
    options = {}
  ) {
    const select = typeof selectOrId === 'string'
      ? $(selectOrId)
      : selectOrId;

    if (!select) {
      return;
    }

    const valueProperty = options.valueProperty || '';
    const labelProperty = options.labelProperty || '';
    const placeholder = options.placeholder || '';

    const optionHtml = [];

    if (placeholder) {
      optionHtml.push(
        `<option value="">${escapeHtml(placeholder)}</option>`
      );
    }

    (values || []).forEach((item, index) => {
      const optionValue = valueProperty
        ? item[valueProperty]
        : (typeof item === 'object' ? index : item);

      const optionLabel = labelProperty
        ? item[labelProperty]
        : (typeof item === 'object' ? String(item) : item);

      optionHtml.push(
        `<option value="${escapeHtml(optionValue)}">` +
        `${escapeHtml(optionLabel)}` +
        '</option>'
      );
    });

    select.innerHTML = optionHtml.join('');
  }


  /**
   * Populates the shared Add New PT Game modal regardless of whether Ordering
   * or PT Reconciliation is the first module opened.
   */
  function populatePTGameTypeDropdown(gameTypes) {
    populateSelectOptions(
      'ng-type',
      gameTypes || []
    );
  }
</script>
